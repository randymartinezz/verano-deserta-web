<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Photos — La Nena 02 May | VERANO DESERT®</title>
  <meta name="description" content="Download your photos from VERANO DESERT® at La Nena, Punta Cana — 02 May 2025. Tag @veranodesert when you share.">
  <meta name="robots" content="noindex, follow">
  <style>

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black:         #080807;
      --black-surface: #100f0d;
      --black-card:    #141210;
      --grey-border:   #252018;
      --white:         #ede8e1;
      --font:          'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    html, body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── NAV ─────────────────────────────────── */

    .gal-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 8, 7, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--grey-border);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gal-nav-back {
      font-family: var(--font);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(237, 232, 225, 0.45);
      text-decoration: none;
      transition: color 0.22s ease;
    }

    .gal-nav-back:hover {
      color: rgba(237, 232, 225, 0.82);
    }

    .gal-nav-brand {
      font-family: var(--font);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.52em;
      text-transform: uppercase;
      color: rgba(237, 232, 225, 0.28);
    }

    /* ── PAGE HEADER ────────────────────────── */

    .gal-header {
      padding: 2.4rem 2rem 2rem;
      text-align: center;
      background: var(--black-surface);
      border-bottom: 1px solid var(--grey-border);
    }

    .gal-header-title {
      font-family: var(--font);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: rgba(237, 232, 225, 0.52);
      margin-bottom: 0.4rem;
    }

    .gal-header-date {
      font-family: var(--font);
      font-size: 8px;
      font-weight: 300;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(200, 196, 190, 0.28);
    }

    /* ── GRID ────────────────────────────────── */

    .gal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      background: var(--black);
    }

    .gal-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      background: var(--black-card);
    }

    .gal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gal-item:hover .gal-img {
      transform: scale(1.04);
    }

    .gal-download {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2.4rem 0.8rem 0.8rem;
      background: linear-gradient(to top, rgba(8,8,7,0.78) 0%, transparent 100%);
      font-family: var(--font);
      font-size: 7px;
      font-weight: 400;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(237, 232, 225, 0.62);
      text-align: center;
      text-decoration: none;
      display: block;
      transition: color 0.22s ease;
    }

    .gal-download:hover {
      color: rgba(237, 232, 225, 1);
    }

    /* ── FOOTER ──────────────────────────────── */

    .gal-footer {
      padding: 4rem 2rem;
      text-align: center;
      background: var(--black-surface);
      border-top: 1px solid var(--grey-border);
    }

    .gal-footer-copy {
      font-family: var(--font);
      font-size: 8px;
      font-weight: 300;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(237, 232, 225, 0.20);
    }

    /* ── RESPONSIVE ──────────────────────────── */

    @media (max-width: 860px) {
      .gal-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      .gal-nav {
        padding: 1rem 1.4rem;
      }
      .gal-header {
        padding: 1.8rem 1.4rem 1.5rem;
      }
      .gal-download {
        font-size: 6px;
        letter-spacing: 0.28em;
      }
    }

  </style>
</head>
<body>

  <!-- nav -->
  <nav class="gal-nav">
    <a href="index.html" class="gal-nav-back">&#8592;&ensp;Back to Home</a>
    <span class="gal-nav-brand">Verano Desert&#xAE;</span>
  </nav>

  <!-- page header -->
  <div class="gal-header">
    <p class="gal-header-title">La Nena &mdash; Punta Cana</p>
    <p class="gal-header-date">02 Mayo 2026</p>
  </div>

  <!-- full photo grid -->
  <div class="gal-grid" id="gal-grid"></div>

  <!-- footer -->
  <div class="gal-footer">
    <p class="gal-footer-copy">Verano Desert&#xAE; 2026 &copy; All Rights Reserved</p>
  </div>


  <script>
    (function () {
      var BASE    = 'https://res.cloudinary.com/ddxiqbykz/image/upload';
      var VERSION = 'v1778098644';
      var TOTAL   = 51;
      var EAGER   = 9;

      /* per-image version overrides for files uploaded under a different version */
      var VERSION_MAP = { 4: 'v1778098537', 5: 'v1778098540' };

      var grid = document.getElementById('gal-grid');
      if (!grid) return;

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }

      var frag = document.createDocumentFragment();

      for (var i = 0; i < TOTAL; i++) {
        var num   = pad2(i);
        var dlNum = pad2(i + 1);
        var ver    = VERSION_MAP[i] || VERSION;
        var imgUrl = BASE + '/q_auto,f_auto/' + ver + '/' + num + '.jpg';
        var dlUrl  = BASE + '/fl_attachment:verano-desert-02may-' + dlNum + '/' + ver + '/' + num + '.jpg';

        var item = document.createElement('div');
        item.className = 'gal-item';

        var img = document.createElement('img');
        img.src       = imgUrl;
        img.alt       = 'Verano Desert — La Nena 02 May';
        img.className = 'gal-img';
        img.decoding  = 'async';
        if (i >= EAGER) img.loading = 'lazy';

        var link = document.createElement('a');
        link.href      = dlUrl;
        link.className = 'gal-download';
        link.innerHTML = '&#8595;&ensp;Descargar';

        item.appendChild(img);
        item.appendChild(link);
        frag.appendChild(item);
      }

      grid.appendChild(frag);
    })();
  </script>

</body>
</html>
